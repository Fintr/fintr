# Production backend deploy (Kamal). Runs ./bin/deploy-be from apps/fintr-be.
#
# Credentials: GitHub Environment "fintr / production" (vars.*) + repo secrets
# FINTR_GCP_DEPLOY_SSH_PRIVATE_KEY and RAILS_MASTER_KEY.

name: Deploy Backend (Production)

on:
  push:
    branches:
      - main
    paths:
      - "apps/fintr-be/**"
      - ".github/workflows/deploy-be.yml"
  workflow_dispatch:

concurrency:
  group: deploy-be-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "fintr / production"
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/fintr-be

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/fintr-be
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify deploy configuration
        env:
          KAMAL_REGISTRY_USERNAME: ${{ vars.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ vars.KAMAL_REGISTRY_PASSWORD }}
          FINTR_GCP_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.FINTR_GCP_DEPLOY_SSH_PRIVATE_KEY }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          missing=()
          [[ -z "$KAMAL_REGISTRY_USERNAME" ]] && missing+=("KAMAL_REGISTRY_USERNAME")
          [[ -z "$KAMAL_REGISTRY_PASSWORD" ]] && missing+=("KAMAL_REGISTRY_PASSWORD")
          [[ -z "$FINTR_GCP_DEPLOY_SSH_PRIVATE_KEY" ]] && missing+=("FINTR_GCP_DEPLOY_SSH_PRIVATE_KEY")
          [[ -z "$RAILS_MASTER_KEY" ]] && missing+=("RAILS_MASTER_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing in fintr / production / repo secrets: ${missing[*]}"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.KAMAL_REGISTRY_USERNAME }}
          password: ${{ vars.KAMAL_REGISTRY_PASSWORD }}

      - name: Configure SSH for Kamal
        env:
          FINTR_GCP_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.FINTR_GCP_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$FINTR_GCP_DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/fintr-gcp-key
          chmod 600 ~/.ssh/fintr-gcp-key
          ssh-keygen -y -f ~/.ssh/fintr-gcp-key >/dev/null

      - name: Verify SSH access to deploy host
        env:
          KAMAL_SSH_USER: ${{ vars.KAMAL_SSH_USER }}
          KAMAL_SSH_HOST: ${{ vars.KAMAL_SSH_HOST }}
        run: |
          ssh -i ~/.ssh/fintr-gcp-key \
            -F config/kamal_ssh.ci.config \
            -o IdentitiesOnly=yes \
            "${KAMAL_SSH_USER}@${KAMAL_SSH_HOST}" \
            echo "SSH OK"

      - name: Write Kamal env files
        env:
          KAMAL_REGISTRY_USERNAME: ${{ vars.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ vars.KAMAL_REGISTRY_PASSWORD }}
          KAMAL_SSH_USER: ${{ vars.KAMAL_SSH_USER }}
          KAMAL_SSH_HOST: ${{ vars.KAMAL_SSH_HOST }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          RACK_ENV: ${{ vars.RACK_ENV }}
          RAILS_ENV: ${{ vars.RAILS_ENV }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PORT: ${{ vars.PORT }}
          AUTH0_URL: ${{ vars.AUTH0_URL }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          USER_AUTH0_ID: ${{ vars.USER_AUTH0_ID }}
          DATABASE_USER: ${{ vars.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ vars.DATABASE_PASSWORD }}
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
          DB_BASE_URL: ${{ vars.DB_BASE_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ vars.OPENROUTER_API_KEY }}
          AI_VISION_PROVIDER: ${{ vars.AI_VISION_PROVIDER }}
          AI_VISION_MODEL: ${{ vars.AI_VISION_MODEL }}
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          M2M_AUTH0_CLIENT_ID: ${{ vars.M2M_AUTH0_CLIENT_ID }}
          M2M_AUTH0_CLIENT_SECRET: ${{ vars.M2M_AUTH0_CLIENT_SECRET }}
          M2M_AUTH0_DOMAIN: ${{ vars.M2M_AUTH0_DOMAIN }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ vars.AUTH0_CLIENT_SECRET }}
          NEXT_PUBLIC_APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_BASE_URL }}
          XENDIT_API_KEY: ${{ vars.XENDIT_API_KEY }}
          XENDIT_WEBHOOK_TOKEN: ${{ vars.XENDIT_WEBHOOK_TOKEN }}
          BREVO_API_KEY: ${{ vars.BREVO_API_KEY }}
        run: |
          printf '%s\n' "$RAILS_MASTER_KEY" > config/master.key
          chmod 600 config/master.key

          : > .env.production
          write_env() { printf '%s=%q\n' "$1" "$2" >> .env.production; }

          write_env KAMAL_REGISTRY_USERNAME "$KAMAL_REGISTRY_USERNAME"
          write_env KAMAL_REGISTRY_PASSWORD "$KAMAL_REGISTRY_PASSWORD"
          write_env KAMAL_SSH_USER "$KAMAL_SSH_USER"
          write_env KAMAL_SSH_KEY_PATH /home/runner/.ssh/fintr-gcp-key
          write_env KAMAL_SSH_HOST "$KAMAL_SSH_HOST"
          write_env KAMAL_SSH_CONFIG_PATHS config/kamal_ssh.ci.config
          write_env RACK_ENV "$RACK_ENV"
          write_env RAILS_ENV "$RAILS_ENV"
          write_env CORS_ORIGINS "$CORS_ORIGINS"
          write_env PORT "$PORT"
          write_env AUTH0_URL "$AUTH0_URL"
          write_env AUTH0_AUDIENCE "$AUTH0_AUDIENCE"
          write_env CLIENT_URL "$CLIENT_URL"
          write_env USER_AUTH0_ID "$USER_AUTH0_ID"
          write_env DATABASE_USER "$DATABASE_USER"
          write_env DATABASE_PASSWORD "$DATABASE_PASSWORD"
          write_env DATABASE_HOST "$DATABASE_HOST"
          write_env DB_BASE_URL "$DB_BASE_URL"
          write_env SENTRY_DSN "$SENTRY_DSN"
          write_env OPENAI_API_KEY "$OPENAI_API_KEY"
          write_env OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          write_env AI_VISION_PROVIDER "$AI_VISION_PROVIDER"
          write_env AI_VISION_MODEL "$AI_VISION_MODEL"
          write_env AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
          write_env AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
          write_env M2M_AUTH0_CLIENT_ID "$M2M_AUTH0_CLIENT_ID"
          write_env M2M_AUTH0_CLIENT_SECRET "$M2M_AUTH0_CLIENT_SECRET"
          write_env M2M_AUTH0_DOMAIN "$M2M_AUTH0_DOMAIN"
          write_env AUTH0_DOMAIN "$AUTH0_DOMAIN"
          write_env AUTH0_CLIENT_ID "$AUTH0_CLIENT_ID"
          write_env AUTH0_CLIENT_SECRET "$AUTH0_CLIENT_SECRET"
          write_env NEXT_PUBLIC_APP_BASE_URL "$NEXT_PUBLIC_APP_BASE_URL"
          write_env XENDIT_API_KEY "$XENDIT_API_KEY"
          write_env XENDIT_WEBHOOK_TOKEN "$XENDIT_WEBHOOK_TOKEN"
          write_env BREVO_API_KEY "$BREVO_API_KEY"

      - name: Deploy backend
        env:
          KAMAL_REGISTRY_USERNAME: ${{ vars.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ vars.KAMAL_REGISTRY_PASSWORD }}
        run: ./bin/deploy-be
