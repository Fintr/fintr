name: CI

on:
  pull_request:
    paths:
      - "apps/fintr-be/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/fintr-be/**"
      - ".github/workflows/ci.yml"

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/fintr-be
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./apps/fintr-be
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/fintr-be
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./apps/fintr-be
          bundler-cache: true

      - name: Lint code for consistent style
        run: make rubocop

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/fintr-be
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      DB_BASE_URL: postgres://postgres:postgres@localhost:5432
      DATABASE_HOST: localhost
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      OPENROUTER_API_KEY: dummy-openrouter-key-for-ci
      OPENAI_API_KEY: dummy-openai-key-for-ci
      XENDIT_API_KEY: dummy-xendit-key-for-ci
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./apps/fintr-be
          bundler-cache: true

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Set up database
        run: RAILS_ENV=test bundle exec rails db:create db:migrate

      - name: Clean TimescaleDB schemas
        run: bundle exec rake db:clean_timescaledb_schemas

      - name: Verify UUID primary keys
        run: bundle exec rake db:verify_uuid_primary_keys

      - name: Run specs
        run: bundle exec rspec
