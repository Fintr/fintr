# PostgreSQL configuration optimized for pgvectorscale
# This file is mounted into the PostgreSQL container

# Connection settings
max_connections = 200
shared_preload_libraries = 'vectorscale'

# Memory settings
shared_buffers = '2GB'
work_mem = '256MB'
maintenance_work_mem = '1GB'
effective_cache_size = '4GB'

# pgvectorscale specific settings
vectorscale.ef = 64
vectorscale.ef_construction = 128

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000

# Performance tuning
checkpoint_completion_target = 0.9
wal_buffers = '64MB'
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Vector operations optimization
enable_hashjoin = on
enable_mergejoin = on
enable_nestloop = on
