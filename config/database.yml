# Database configuration for all environments

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary: &primary_development
    <<: *default
    database: fintr_development
    host: localhost
    port: 5433  # Different port to avoid conflict with local PostgreSQL
    username: fintr_rails
    password: <%= ENV['DATABASE_PASSWORD'] || 'postgres' %>
    # Basic settings for local development with TimescaleDB
    variables:
      work_mem: '4MB'
      maintenance_work_mem: '64MB'
      effective_cache_size: '1GB'

    # Connection pooling - should match RAILS_MAX_THREADS
    # Each cache/queue/cable connection also uses this pool
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

    timeout: 5000
  cache:
    <<: *primary_development
    database: fintr_development_cache
    url: <%= "postgresql://fintr_rails:#{ENV['DATABASE_PASSWORD'] || 'postgres'}@localhost:5433/fintr_development_cache" %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_development
    database: fintr_development_queue
    url: <%= "postgresql://fintr_rails:#{ENV['DATABASE_PASSWORD'] || 'postgres'}@localhost:5433/fintr_development_queue" %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_development
    database: fintr_development_cable
    url: <%= "postgresql://fintr_rails:#{ENV['DATABASE_PASSWORD'] || 'postgres'}@localhost:5433/fintr_development_cable" %>
    migrations_paths: db/cable_migrate

test:
  primary: &primary_test
    <<: *default
    database: fintr_test
    host: localhost
    port: 5433
    username: <%= ENV['DATABASE_USER'] || 'postgres' %>
    password: <%= ENV['DATABASE_PASSWORD'] || 'postgres' %>
    # Basic settings for local development with TimescaleDB
    variables:
      work_mem: '4MB'
      maintenance_work_mem: '64MB'
      effective_cache_size: '1GB'
    pool: 10
    timeout: 5000

