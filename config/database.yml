  queue:
    <<: *primary_production
    database: fintr_production_queue
    url: <%= "postgresql://fintr_rails:#{ENV['DATABASE_PASSWORD']}@#{ENV['DATABASE_HOST'] || 'api.fintr.ai'}:5432/fintr_production_queue" %>
    migrations_paths: db/queue_migrate
    # Queue database needs fewer connections (Solid Queue manages its own)
