    database: fintr_production_cable
    url: <%= "postgresql://fintr_rails:#{ENV['DATABASE_PASSWORD']}@#{ENV['DATABASE_HOST'] || 'api.fintr.ai'}:5432/fintr_production_cable" %>
    migrations_paths: db/cable_migrate
    # Cable database needs fewer connections
    pool: <%= ENV.fetch("CABLE_POOL_SIZE") { 2 } %>
    timeout: 5000


