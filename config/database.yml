  primary: &primary_production
    <<: *default
    database: fintr_production
    host: <%= ENV['DATABASE_HOST'] || 'api.fintr.ai' %>
    port: 5432
    username: fintr_rails
    password: <%= ENV['DATABASE_PASSWORD'] %>
    # pgvectorscale specific settings
