    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 2 %>
    timeout: 5000
    # Connection checkout timeout - how long to wait for a connection
    checkout_timeout: 5
  cache:
    <<: *primary_production
    database: fintr_production_cache
    url: <%= "postgresql://fintr_rails:#{ENV['DATABASE_PASSWORD']}@#{ENV['DATABASE_HOST'] || 'api.fintr.ai'}:5432/fintr_production_cache" %>
    migrations_paths: db/cache_migrate
