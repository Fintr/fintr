# PostgreSQL configuration for local development with TimescaleDB and pgvectorscale
# This file is optimized for local development with TimescaleDB and pgvectorscale

# Connection settings
max_connections = 100
listen_addresses = '*'
shared_preload_libraries = 'timescaledb'

# Memory settings (reduced for local development)
shared_buffers = '256MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
effective_cache_size = '1GB'

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000

# Performance tuning
checkpoint_completion_target = 0.9
wal_buffers = '16MB'
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Vector operations optimization
enable_hashjoin = on
enable_mergejoin = on
enable_nestloop = on
