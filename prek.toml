# Hook behavior for this repo. Entrypoints are tracked in .githooks/ (see bin/setup-git-hooks).
# Do not rely on `prek install` — it writes local shims under .husky/_/, which are not shared.
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"
hooks = [
  {
    id = "backend-rspec-changed",
    name = "Backend RSpec (changed files only)",
    language = "system",
    entry = "bash scripts/git-hooks/pre-commit-backend-rspec.sh",
    stages = ["pre-commit"],
    pass_filenames = false,
    always_run = true,
  },
  {
    id = "frontend-pre-push",
    name = "Frontend Vitest / Playwright (scoped)",
    language = "system",
    entry = "bash scripts/git-hooks/pre-push-frontend.sh",
    stages = ["pre-push"],
    pass_filenames = false,
    always_run = true,
  },
]
