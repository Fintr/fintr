# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec
  - rubocop-performance

Style/FrozenStringLiteralComment:
  Enabled: true

Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: True

Rails/TimeZone:
  Enabled: true
  EnforcedStyle: strict

Layout/ArrayAlignment:
  Enabled: true

Layout/HashAlignment:
  Enabled: true

RSpec/NestedGroups:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

RSpec/ChangeByZero:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

Style/HashSyntax:
  Enabled: false

RSpec/ReceiveMessages:
  Enabled: false

RSpec/RepeatedSubjectCall:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false


RSpec/MessageSpies:
  Enabled: true
  Exclude:
    - spec/jobs/transactions/check_duplicate_today_job_spec.rb

Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: true
  EnforcedStyle: no_space
