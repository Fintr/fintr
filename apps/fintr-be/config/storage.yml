test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

<% require "json" %>
<% require "base64" %>
<%
  gcs_credentials_raw = ENV["GCS_CREDENTIALS"].to_s.strip
  gcs_credentials =
    if gcs_credentials_raw.empty?
      nil
    else
      gcs_credentials_json =
        if gcs_credentials_raw.start_with?("{")
          gcs_credentials_raw
        else
          Base64.decode64(gcs_credentials_raw)
        end

      JSON.parse(gcs_credentials_json)
    end

  gcs_project = ENV["GCS_PROJECT"].to_s.strip
  gcs_project = gcs_credentials["project_id"] if gcs_project.empty? && gcs_credentials
  gcs_bucket = "fintr-#{Rails.env}"
%>
google:
  service: GCS
  project: <%= gcs_project %>
  bucket: <%= gcs_bucket %>
  public: true
<% if gcs_credentials %>
  credentials:
<%= gcs_credentials.to_yaml.sub(/\A---\n/, "").gsub(/^/, "    ") %>
<% end %>
