<% require "pathname" %>
<% require "uri" %>
<%
  fintr_be_root =
    if ENV["FINTR_BE_ROOT"] && !ENV["FINTR_BE_ROOT"].strip.empty?
      Pathname(ENV["FINTR_BE_ROOT"]).expand_path
    elsif Pathname.pwd.join("config/deploy.fe.yml").exist?
      Pathname.pwd
    elsif Pathname.pwd.join("apps/fintr-be/config/deploy.fe.yml").exist?
      Pathname.pwd.join("apps/fintr-be")
    else
      Pathname.pwd
    end

  fintr_fe_root = fintr_be_root.join("../fintr-fe")
  fe_dotenv = fintr_fe_root.join(".env.production")
  be_dotenv = fintr_be_root.join(".env.production")

  require "dotenv"

  # Frontend build vars first; backend deploy credentials win on duplicate keys.
  Dotenv.load(fe_dotenv.to_s, overwrite: true) if fe_dotenv.exist?
  Dotenv.load(be_dotenv.to_s, overwrite: true) if be_dotenv.exist?

  app_base_url = ENV.fetch("NEXT_PUBLIC_APP_BASE_URL")
  fe_proxy_host = ENV["FRONTEND_PROXY_HOST"].to_s.strip
  fe_proxy_host = URI.parse(app_base_url).host if fe_proxy_host.empty?
  if fe_proxy_host.nil? || fe_proxy_host.empty?
    raise "Set FRONTEND_PROXY_HOST or NEXT_PUBLIC_APP_BASE_URL in apps/fintr-fe/.env.production (web deploy; mobile uses .env.mobile.production)"
  end

  fe_proxy_hosts = ENV["FRONTEND_PROXY_HOSTS"].to_s.split(",").map(&:strip).reject(&:empty?)
  if fe_proxy_hosts.empty?
    fe_proxy_hosts = [fe_proxy_host]
    www_host = fe_proxy_host.start_with?("www.") ? fe_proxy_host : "www.#{fe_proxy_host}"
    apex_host = fe_proxy_host.sub(/\Awww\./, "")
    fe_proxy_hosts = [apex_host, www_host].uniq
  end

  # SSH target (the VM). Same box as the API — NOT the public site URL (see proxy.host / FRONTEND_PROXY_HOST).
  kamal_ssh_host = ENV["KAMAL_SSH_HOST"].to_s.strip
  kamal_ssh_host = ENV["KAMAL_DEPLOY_HOST"].to_s.strip if kamal_ssh_host.empty? # legacy name
  kamal_ssh_host = "api.fintr.ai" if kamal_ssh_host.empty?

  kamal_ssh_user = ENV["KAMAL_SSH_USER"].to_s.strip
  raise "Set KAMAL_SSH_USER in apps/fintr-be/.env.production (or apps/fintr-fe/.env.production)" if kamal_ssh_user.empty?

  kamal_ssh_key = ENV["KAMAL_SSH_KEY_PATH"].to_s.strip
  kamal_ssh_key = "~/.ssh/fintr-gcp-key" if kamal_ssh_key.empty?

  kamal_ssh_config_paths = ENV["KAMAL_SSH_CONFIG_PATHS"].to_s.split(",").map(&:strip).reject(&:empty?)
  kamal_ssh_configs = [
    fintr_be_root.join("config/kamal_ssh.config"),
    fintr_be_root.join("config/kamal_ssh.production.config"),
  ].select(&:exist?) + kamal_ssh_config_paths.map { |path| Pathname(path).expand_path }
  kamal_ssh_configs.uniq!

  kamal_proxy_forward_headers = !%w[0 false no off].include?(ENV.fetch("KAMAL_PROXY_FORWARD_HEADERS", "true").to_s.strip.downcase)
%>
# Production frontend (static Next export in apps/fintr-fe).
# Deploy: ./bin/deploy-fe   or   ./bin/kamal deploy -c config/deploy.fe.yml
#
# Env: apps/fintr-fe/.env.production (web build) + apps/fintr-be/.env.production (registry, SSH).
# Kamal SSH: KAMAL_SSH_USER, KAMAL_SSH_KEY_PATH, KAMAL_SSH_HOST (VM to SSH into).
# Public site + TLS: proxy.hosts (fintr.ai + www.fintr.ai by default). Override with FRONTEND_PROXY_HOSTS.

secrets_path: .kamal/secrets.fe

service: fintr-fe

image: adminfintr/fintr-fe

servers:
  web:
    hosts:
      - <%= kamal_ssh_host %>

# Let's Encrypt via kamal-proxy (ports 80/443 must reach the VM; DNS for each host → VM).
proxy:
  ssl: true
  hosts:
<% fe_proxy_hosts.each do |proxy_host| %>
    - <%= proxy_host %>
<% end %>
  forward_headers: <%= kamal_proxy_forward_headers %>
  app_port: 3000
  healthcheck:
    path: /
    interval: 3
    timeout: 5
  response_timeout: 30

registry:
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  provenance: false
  context: <%= fintr_fe_root.to_s %>
  dockerfile: <%= fintr_fe_root.join("Dockerfile").to_s %>
  args:
    NEXT_PUBLIC_APP_BASE_URL: "<%= ENV.fetch("NEXT_PUBLIC_APP_BASE_URL") %>"
    NEXT_PUBLIC_BE_URL: "<%= ENV.fetch("NEXT_PUBLIC_BE_URL") %>"
    NEXT_PUBLIC_AUTH0_DOMAIN: "<%= ENV.fetch("NEXT_PUBLIC_AUTH0_DOMAIN") %>"
    NEXT_PUBLIC_AUTH0_CLIENT_ID: "<%= ENV.fetch("NEXT_PUBLIC_AUTH0_CLIENT_ID") %>"
    NEXT_PUBLIC_AUTH0_AUDIENCE: "<%= ENV.fetch("NEXT_PUBLIC_AUTH0_AUDIENCE") %>"
    NEXT_PUBLIC_ENVIRONMENT: "<%= ENV.fetch("NEXT_PUBLIC_ENVIRONMENT", "production") %>"
    NEXT_PUBLIC_SENTRY_DSN: "<%= ENV["NEXT_PUBLIC_SENTRY_DSN"].to_s %>"
    NEXT_PUBLIC_SHOW_V2: "<%= ENV["NEXT_PUBLIC_SHOW_V2"].to_s %>"
    NEXT_PUBLIC_MAINTENANCE_MODE: "<%= ENV["NEXT_PUBLIC_MAINTENANCE_MODE"].to_s %>"
    NEXT_PUBLIC_MAINTENANCE_TITLE: "<%= ENV["NEXT_PUBLIC_MAINTENANCE_TITLE"].to_s %>"
    NEXT_PUBLIC_MAINTENANCE_MESSAGE: "<%= ENV["NEXT_PUBLIC_MAINTENANCE_MESSAGE"].to_s %>"
    SENTRY_AUTH_TOKEN: "<%= ENV["SENTRY_AUTH_TOKEN"].to_s %>"

ssh:
  user: "<%= kamal_ssh_user %>"
  keys:
    - <%= kamal_ssh_key %>
  config:
<% kamal_ssh_configs.each do |config_path| %>
    - <%= config_path.to_s %>
<% end %>

sshkit:
  pool_idle_timeout: 180

deploy_timeout: 120
boot:
  limit: 1
  wait: 5
