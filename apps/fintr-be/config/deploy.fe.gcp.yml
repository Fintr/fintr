<% require "pathname" %>
<% require "uri" %>
<%
  fintr_be_root =
    if ENV["FINTR_BE_ROOT"] && !ENV["FINTR_BE_ROOT"].strip.empty?
      Pathname(ENV["FINTR_BE_ROOT"]).expand_path
    elsif Pathname.pwd.join("config/deploy.fe.gcp.yml").exist?
      Pathname.pwd
    elsif Pathname.pwd.join("apps/fintr-be/config/deploy.fe.gcp.yml").exist?
      Pathname.pwd.join("apps/fintr-be")
    else
      Pathname.pwd
    end

  fintr_fe_root = fintr_be_root.join("../fintr-fe")

  fe_gcp_dotenv = fintr_fe_root.join(".env.gcp.production")
  be_dotenv = fintr_be_root.join(".env.production")

  require "dotenv"

  if be_dotenv.exist?
    Dotenv.load(be_dotenv.to_s, overwrite: true)
  end

  if fe_gcp_dotenv.exist?
    Dotenv.load(fe_gcp_dotenv.to_s, overwrite: true)
  else
    raise "Missing #{fe_gcp_dotenv} — copy apps/fintr-fe/.env.production to .env.gcp.production and set GCP hosts (see .env.gcp.production.example)"
  end

  app_base_url = ENV.fetch("NEXT_PUBLIC_APP_BASE_URL")
  fe_proxy_host = ENV.fetch("FRONTEND_PROXY_HOST") { URI.parse(app_base_url).host }
  kamal_proxy_ssl = ENV.fetch("KAMAL_PROXY_SSL", "false") == "true"
%>
# GCP production frontend (static Next export in apps/fintr-fe).
# Deploy: ./bin/deploy-gcp-fe   or   ./bin/kamal deploy -c config/deploy.fe.gcp.yml
#
# Build context is apps/fintr-fe; Kamal runs from apps/fintr-be (monorepo).
# Proxy routes by hostname (e.g. www.fintr.ai) — point DNS at the VM alongside the API host.
# Registry: apps/fintr-be/.env.production. Frontend: apps/fintr-fe/.env.gcp.production. Uses .kamal/secrets.

service: fintr-fe

image: adminfintr/fintr-fe

servers:
  web:
    hosts:
      - 34.21.206.91

proxy:
  ssl: <%= kamal_proxy_ssl %>
  host: <%= fe_proxy_host %>
  app_port: 3000
  healthcheck:
    path: /
    interval: 3
    timeout: 5
  response_timeout: 30

registry:
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  provenance: false
  context: <%= fintr_fe_root.to_s %>
  # Path must be absolute (or relative to apps/fintr-be). "Dockerfile" alone resolves to fintr-be's Rails Dockerfile.
  dockerfile: <%= fintr_fe_root.join("Dockerfile").to_s %>
  args:
    NEXT_PUBLIC_APP_BASE_URL: "<%= ENV.fetch("NEXT_PUBLIC_APP_BASE_URL") %>"
    NEXT_PUBLIC_BE_URL: "<%= ENV.fetch("NEXT_PUBLIC_BE_URL") %>"
    NEXT_PUBLIC_AUTH0_DOMAIN: "<%= ENV.fetch("NEXT_PUBLIC_AUTH0_DOMAIN") %>"
    NEXT_PUBLIC_AUTH0_CLIENT_ID: "<%= ENV.fetch("NEXT_PUBLIC_AUTH0_CLIENT_ID") %>"
    NEXT_PUBLIC_AUTH0_AUDIENCE: "<%= ENV.fetch("NEXT_PUBLIC_AUTH0_AUDIENCE") %>"
    NEXT_PUBLIC_ENVIRONMENT: "<%= ENV.fetch("NEXT_PUBLIC_ENVIRONMENT", "production") %>"
    NEXT_PUBLIC_SENTRY_DSN: "<%= ENV["NEXT_PUBLIC_SENTRY_DSN"].to_s %>"
    NEXT_PUBLIC_SHOW_V2: "<%= ENV["NEXT_PUBLIC_SHOW_V2"].to_s %>"
    NEXT_PUBLIC_MAINTENANCE_MODE: "<%= ENV["NEXT_PUBLIC_MAINTENANCE_MODE"].to_s %>"
    NEXT_PUBLIC_MAINTENANCE_TITLE: "<%= ENV["NEXT_PUBLIC_MAINTENANCE_TITLE"].to_s %>"
    NEXT_PUBLIC_MAINTENANCE_MESSAGE: "<%= ENV["NEXT_PUBLIC_MAINTENANCE_MESSAGE"].to_s %>"
    SENTRY_AUTH_TOKEN: "<%= ENV["SENTRY_AUTH_TOKEN"].to_s %>"

ssh:
  user: miguel.dagatan
  keys:
    - ~/.ssh/id_ed25519
  config:
    - <%= fintr_be_root.join("config/kamal_ssh.config").to_s %>
    - <%= fintr_be_root.join("config/kamal_ssh.gcp.config").to_s %>

sshkit:
  pool_idle_timeout: 180

deploy_timeout: 120
boot:
  limit: 1
  wait: 5
