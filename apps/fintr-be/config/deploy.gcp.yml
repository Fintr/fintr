<% require "pathname" %>
<%
  fintr_be_root =
    if ENV["FINTR_BE_ROOT"] && !ENV["FINTR_BE_ROOT"].strip.empty?
      Pathname(ENV["FINTR_BE_ROOT"]).expand_path
    elsif Pathname.pwd.join("config/deploy.yml").exist? || Pathname.pwd.join("config/deploy.gcp.yml").exist?
      Pathname.pwd
    elsif Pathname.pwd.join("apps/fintr-be/config/deploy.yml").exist? || Pathname.pwd.join("apps/fintr-be/config/deploy.gcp.yml").exist?
      Pathname.pwd.join("apps/fintr-be")
    else
      Pathname.pwd
    end
%>
<% require "dotenv"; Dotenv.load(fintr_be_root.join(".env.production").to_s, overwrite: true) %>
# Google Cloud Platform production deploy (parallel to AWS until cutover).
# Deploy (same secrets as AWS — local .env.production, not committed):
#   ./bin/deploy-gcp
#
# Same service name as AWS (fintr-be) so migration is a host/DNS swap after data copy.
# Secrets: default .kamal/secrets (ENV from .env.production above). Omit secrets_path — older Kamal rejects it.
# Optional later: Google Secret Manager — docs/GCP_SECRET_MANAGER.md
# SSH: miguel.dagatan@34.21.206.91 with ~/.ssh/id_ed25519 (see config/kamal_ssh.gcp.config).
#
# Deploy: ./bin/deploy-gcp   or   ./bin/kamal deploy -d gcp

service: fintr-be

image: adminfintr/fintr-be

servers:
  web:
    hosts:
      - 34.21.206.91
    options:
      network: private
  job:
    hosts:
      - 34.21.206.91
    cmd: bin/jobs
    options:
      network: private

# Let's Encrypt requires a DNS name; use ssl: true only after pointing a domain at this VM.
proxy:
  ssl: false
  host: 34.21.206.91
  app_port: 3000
  healthcheck:
    path: /up
    interval: 1
    timeout: 5
  response_timeout: 30

registry:
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  provenance: false
  args:
    RUBY_VERSION: "<%= fintr_be_root.join('.ruby-version').read.strip.delete_prefix('ruby-').delete_prefix('ruby ') %>"
    BUNDLER_VERSION: 2.6.2
    RAILS_MASTER_KEY:
      - RAILS_MASTER_KEY

env:
  clear:
    DATABASE_HOST: fintr-be-postgres
    DATABASE_USER: fintr_rails
    DATABASE_NAME: fintr_production
  secret:
    - RAILS_MASTER_KEY
    - AUTH0_URL
    - AUTH0_AUDIENCE
    - CLIENT_URL
    - CORS_ORIGINS
    - RACK_ENV
    - RAILS_ENV
    - PORT
    - USER_AUTH0_ID
    - DATABASE_PASSWORD
    - DB_BASE_URL
    - SENTRY_DSN
    - OPENAI_API_KEY
    - OPENROUTER_API_KEY
    - AI_VISION_PROVIDER
    - AI_VISION_MODEL
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - M2M_AUTH0_CLIENT_ID
    - M2M_AUTH0_CLIENT_SECRET
    - M2M_AUTH0_DOMAIN
    - AUTH0_CLIENT_ID
    - AUTH0_CLIENT_SECRET
    - NEXT_PUBLIC_APP_BASE_URL
    - AUTH0_DOMAIN
    - XENDIT_API_KEY
    - XENDIT_WEBHOOK_TOKEN
    - BREVO_API_KEY

ssh:
  user: miguel.dagatan
  keys:
    - ~/.ssh/id_ed25519
  config:
    - <%= fintr_be_root.join("config/kamal_ssh.config").to_s %>
    - <%= fintr_be_root.join("config/kamal_ssh.gcp.config").to_s %>

sshkit:
  pool_idle_timeout: 180

accessories:
  postgres:
    image: timescale/timescaledb-ha:pg17
    host: 34.21.206.91
    env:
      clear:
        POSTGRES_DB: fintr_production
        POSTGRES_USER: fintr_admin
        POSTGRES_PASSWORD: <%= ENV.fetch("DATABASE_PASSWORD") %>
        POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      secret:
        - DATABASE_PASSWORD
    files:
      - <%= fintr_be_root.join("config/postgresql.conf") %>:/etc/postgresql/postgresql.conf
      - <%= fintr_be_root.join("config/init-pgvectorscale.sh") %>:/docker-entrypoint-initdb.d/init-pgvectorscale.sh
    directories:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    options:
      memory: 1g
      cpus: 1.0
      network: private

deploy_timeout: 30
boot:
  limit: 1
  wait: 5
