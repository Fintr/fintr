// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
            }
        }
        // Plugins such as @capacitor/filesystem use kotlin { jvmToolchain(21) }; that must match
        // Java 21 above or Gradle fails with "Inconsistent JVM-target compatibility".
        def kotlinExt = project.extensions.findByName('kotlin')
        if (kotlinExt != null) {
            try {
                kotlinExt.jvmToolchain(21)
            } catch (Exception e) {
                project.logger.warn(
                    "Could not set Kotlin JVM toolchain to 21 for ${project.path}: ${e.message}"
                )
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
