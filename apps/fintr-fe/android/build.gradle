// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        def androidExt = project.extensions.findByName("android")
        if (androidExt == null) {
            return
        }

        def kotlinJvmTarget = null
        if (androidExt.hasProperty("kotlinOptions")) {
            kotlinJvmTarget = androidExt.kotlinOptions.jvmTarget
        }

        // RevenueCat pins Kotlin 1.8, which cannot target 21. Leave that module on Java 8.
        // Other plugins (for example @capacitor/filesystem) use jvmToolchain(21) and must
        // compile Java and Kotlin to the same version.
        if (kotlinJvmTarget == "1.8") {
            androidExt.compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
            return
        }

        androidExt.compileOptions {
            sourceCompatibility JavaVersion.VERSION_21
            targetCompatibility JavaVersion.VERSION_21
        }

        def kotlinExt = project.extensions.findByName("kotlin")
        if (kotlinExt != null) {
            try {
                kotlinExt.jvmToolchain(21)
            } catch (Exception e) {
                project.logger.warn(
                    "Could not set Kotlin JVM toolchain to 21 for ${project.path}: ${e.message}"
                )
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
